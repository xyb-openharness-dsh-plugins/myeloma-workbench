          - generic [ref=e251]: 01 · DISEASE
          - heading "定义" [level=2] [ref=e252]
          - paragraph [ref=e253]: 多发性骨髓瘤（MM）是以克隆性浆细胞增殖为特征的浆细胞肿瘤。
        - generic [ref=e254]:
          - paragraph [ref=e255]: 浆细胞属于免疫系统中的 B 细胞谱系，主要位于骨髓。异常浆细胞增殖并产生单克隆免疫球蛋白或其片段（M 蛋白）；疾病可涉及一个或多个骨髓部位，也可能出现溶骨性病灶。多发性骨髓瘤属于浆细胞疾病谱，常需与意义未明的单克隆丙种球蛋白病（MGUS）、冒烟型骨髓瘤（SMM）及浆细胞瘤等分类区分。分类与诊断需依据完整检查和临床团队记录，本台不自行判断。
          - generic [ref=e256]:
            - article [ref=e257]:
              - generic [ref=e258]: 疾病分类
              - paragraph [ref=e259]: WHO 第 5 版造血与淋巴组织肿瘤分类将浆细胞骨髓瘤列于淋巴浆细胞及浆细胞肿瘤相关层级。完整分类原文未纳入本项目。
            - article [ref=e260]:
              - generic [ref=e261]: 常见分泌类型
              - paragraph [ref=e262]: 可见 IgG、IgA 等重链类型，也有轻链型。轻链型的记录可能需要单独查看血清游离轻链（FLC）；不能只凭单一检测推断病情。
            - article [ref=e263]:
              - generic [ref=e264]: 诊断相关框架
              - paragraph [ref=e265]: CRAB 涵盖高钙血症、肾功能损害、贫血和骨病变；SLiM 还涉及骨髓克隆性浆细胞比例、游离轻链比值和 MRI 病灶等定义事件。
            - article [ref=e266]:
